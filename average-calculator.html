<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Average Calculator - Free Calculator | DukaanCalc</title>
<meta name="description" content="Free average calculator to quickly calculate the average of multiple numbers.">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="canonical" href="https://websitemaker01001-max.github.io/dukaancalc/average-calculator.html">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f6f8;color:#111827}
.header{background:#111827;color:white;text-align:center;padding:28px 15px}
.header h1{margin:0;font-size:28px}.header p{margin:8px 0}
.container{max-width:600px;margin:20px auto;padding:15px}
.card,.info{background:white;padding:20px;margin-bottom:18px;border-radius:15px;box-shadow:0 3px 12px rgba(0,0,0,.08)}
label{display:block;margin-top:12px;font-weight:bold}
input{width:100%;padding:12px;margin-top:6px;border:1px solid #ccc;border-radius:8px;font-size:16px}
button{width:100%;padding:13px;margin-top:15px;border:0;border-radius:8px;background:#2563eb;color:white;font-size:16px;font-weight:bold}
.result{margin-top:15px;padding:12px;background:#f3f4f6;border-radius:8px;text-align:center;line-height:1.7;font-weight:bold}
.info{line-height:1.7}.footer{text-align:center;padding:25px;color:#666;font-size:13px}
a{color:#2563eb;text-decoration:none;font-weight:bold}
</style>
</head>
<body>

<div class="header">
<h1>🔢 Average Calculator</h1>
<p>Calculate Average of Multiple Numbers</p>
</div>

<div class="container">
<div class="card">
<h2>Average Calculator</h2>

<label>Numbers (comma separated)</label>
<input type="text" id="numbers" placeholder="10,20,30,40">

<button onclick="calculate()">Calculate Average</button>

<div class="result" id="result">Result यहाँ दिखाई देगा</div>
</div>

<div class="info">
<h2>How to Calculate Average?</h2>
<p>Average is calculated by adding all numbers and dividing the total by the number of values.</p>
<p><a href="index.html">← Back to DukaanCalc</a></p>
</div>
</div>

<div class="footer">© 2026 DukaanCalc | Free Business Tools</div>

<script>
function calculate(){
let text=document.getElementById("numbers").value.trim();

if(!text){
document.getElementById("result").innerHTML="⚠️ Numbers डालें";
return;
}

let values=text.split(",").map(Number);

if(values.some(isNaN)){
document.getElementById("result").innerHTML="⚠️ सही numbers डालें";
return;
}

let sum=values.reduce((a,b)=>a+b,0);
let average=sum/values.length;

document.getElementById("result").innerHTML=
"🔢 Total: "+sum+
"<br>📊 Average: "+average.toFixed(2);
}
</script>

</body>
</html>
