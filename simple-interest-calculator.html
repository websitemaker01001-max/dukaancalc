<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Simple Interest Calculator - Free Calculator | DukaanCalc</title>
<meta name="description" content="Free simple interest calculator to calculate interest and total amount using principal, rate and time.">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f6f8;color:#111827}
.header{background:#111827;color:white;text-align:center;padding:28px 15px}
.header h1{margin:0;font-size:28px}
.header p{margin:8px 0}
.container{max-width:600px;margin:20px auto;padding:15px}
.card,.info{background:white;padding:20px;margin-bottom:18px;border-radius:15px;box-shadow:0 3px 12px rgba(0,0,0,.08)}
h2{margin-top:0}
label{display:block;margin-top:12px;font-weight:bold}
input{width:100%;padding:12px;margin-top:6px;border:1px solid #ccc;border-radius:8px;font-size:16px}
button{width:100%;padding:13px;margin-top:15px;border:0;border-radius:8px;background:#2563eb;color:white;font-size:16px;font-weight:bold}
.result{margin-top:15px;padding:12px;background:#f3f4f6;border-radius:8px;text-align:center;line-height:1.7;font-weight:bold}
.info{line-height:1.7}
.footer{text-align:center;padding:25px;color:#666;font-size:13px}
a{color:#2563eb;text-decoration:none;font-weight:bold}
</style>
</head>

<body>

<div class="header">
<h1>💰 Simple Interest Calculator</h1>
<p>Calculate Interest & Total Amount</p>
</div>

<div class="container">

<div class="card">
<h2>Simple Interest Calculator</h2>

<label>Principal (₹)</label>
<input type="number" id="principal" placeholder="10000">

<label>Interest Rate (% per year)</label>
<input type="number" id="rate" placeholder="10">

<label>Time (Years)</label>
<input type="number" id="time" placeholder="2">

<button onclick="calculate()">Calculate Interest</button>

<div class="result" id="result">Result यहाँ दिखाई देगा</div>
</div>

<div class="info">
<h2>Simple Interest Formula</h2>
<p>Simple Interest = Principal × Rate × Time ÷ 100.</p>

<p><a href="index.html">← Back to DukaanCalc</a></p>
</div>

</div>

<div class="footer">© 2026 DukaanCalc | Free Business Tools</div>

<script>
function calculate(){

let p=Number(document.getElementById("principal").value);
let r=Number(document.getElementById("rate").value);
let t=Number(document.getElementById("time").value);

if(p<=0 || r<0 || t<=0){
document.getElementById("result").innerHTML="⚠️ Please enter valid values";
return;
}

let interest=p*r*t/100;
let total=p+interest;

document.getElementById("result").innerHTML=
"💰 Interest: ₹"+interest.toFixed(2)+
"<br>💳 Total Amount: ₹"+total.toFixed(2);

}
</script>

</body>
</html>
